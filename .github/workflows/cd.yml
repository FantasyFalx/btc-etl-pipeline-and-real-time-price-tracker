name: CD

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  # GCP constants
  GCP_PROJECT_ID: "bitcoin-streaming-etl-project"
  GAR_LOCATION: "us-central1"
  DATAFLOW_ZONE: "us-east1-b"
  DATAFLOW_STAGING_BUCKET: "staging-bucket-88888"
  MACHINE_TYPE: "e2-medium"
  REGION: "us-east1"

  # GCP secrets and service account emails
  GCP_BUILD_AND_DEPLOY_KEY: ${{ secrets.BUILD_AND_DEPLOY_KEY }}
  COMPUTE_SERVICE_ACCOUNT_EMAIL: ${{ secrets.COMPUTE_SERVICE_ACCOUNT_EMAIL }}
  DATAFLOW_SERVICE_ACCOUNT_EMAIL: ${{ secrets.DATAFLOW_SERVICE_ACCOUNT_EMAIL }}

  # Container constants and image names
  ARTIFACT_REPO: pub-sub-script-repo
  PUBSUB_IMAGE_NAME: btc-pubsub-messenger
  DATAFLOW_IMAGE_NAME: btc-dataflow-pipeline

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Set computed environment variables
        run: |
          # Image URI structure: [registry]/[namespace]/[image]:[tag]
          echo "PUBSUB_IMAGE_REPO=${{ env.GAR_LOCATION }}-docker.pkg.dev/${{ env.GCP_PROJECT_ID }}/${{ env.ARTIFACT_REPO }}/${{ env.PUBSUB_IMAGE_NAME }}" >> "$GITHUB_ENV"
          echo "DATAFLOW_IMAGE_REPO=${{ env.GAR_LOCATION }}-docker.pkg.dev/${{ env.GCP_PROJECT_ID }}/${{ env.ARTIFACT_REPO }}/${{ env.DATAFLOW_IMAGE_NAME }}" >> "$GITHUB_ENV"

      - name: Checkout
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ env.GCP_BUILD_AND_DEPLOY_KEY }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker ${{ env.GAR_LOCATION }}-docker.pkg.dev --quiet

      - name: Debug container image URI parts
        run: |
          echo "Pub/Sub image repo: ${{ env.PUBSUB_IMAGE_REPO }}"
          echo "Dataflow image repo: ${{ env.DATAFLOW_IMAGE_REPO }}"

      - name: Build and push pubsub publisher component image
        uses: docker/build-push-action@v6
        with:
          context: ./src
          file: ./src/btc_streaming_etl/pubsub/Dockerfile
          push: true
          tags: |
            ${{ env.PUBSUB_IMAGE_REPO }}:${{ github.sha }}
            ${{ env.PUBSUB_IMAGE_REPO }}:pubsub-latest

      - name: Build and push dataflow pipeline image
        uses: docker/build-push-action@v6
        with:
          context: ./src
          file: ./src/btc_streaming_etl/dataflow/Dockerfile
          push: true
          tags: |
            ${{ env.DATAFLOW_IMAGE_REPO }}:${{ github.sha }}
            ${{ env.DATAFLOW_IMAGE_REPO }}:beam-latest

  deploy-pubsub:
    runs-on: ubuntu-latest
    needs: build-and-push
    permissions:
      contents: read

    steps:
      - name: Set computed environment variables
        run: |
          echo "PUBSUB_IMAGE_REPO=${{ env.GAR_LOCATION }}-docker.pkg.dev/${{ env.GCP_PROJECT_ID }}/${{ env.ARTIFACT_REPO }}/${{ env.PUBSUB_IMAGE_NAME }}" >> "$GITHUB_ENV"

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ env.GCP_BUILD_AND_DEPLOY_KEY }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Deploy Pub/Sub messenger Cloud Run job
        run: |
          gcloud run jobs deploy btc-pubsub-messenger \
            --image "${{ env.PUBSUB_IMAGE_REPO }}:pubsub-latest" \
            --region "${{ env.GAR_LOCATION }}" \
            --service-account "${{ env.COMPUTE_SERVICE_ACCOUNT_EMAIL }}" \
            --tasks 1 \
            --max-retries 3 \
            --task-timeout 168h \
            --execute-now \
            --quiet

  deploy-dataflow:
    runs-on: ubuntu-latest
    needs: build-and-push
    permissions:
      contents: read

    steps:
      - name: Set computed environment variables
        run: |
          # Bucket URI structure: gs://[bucket_name]/[path]
          echo "FLEX_TEMPLATE_URI=gs://${{ env.DATAFLOW_STAGING_BUCKET }}/templates/btc-dataflow-pipeline.json" >> "$GITHUB_ENV"
          echo "DATAFLOW_STAGING_LOCATION_URI=gs://${{ env.DATAFLOW_STAGING_BUCKET }}/staging" >> "$GITHUB_ENV"
          echo "DATAFLOW_TEMP_LOCATION_URI=gs://${{ env.DATAFLOW_STAGING_BUCKET }}/tmp" >> "$GITHUB_ENV"
          echo "DATAFLOW_IMAGE_REPO=${{ env.GAR_LOCATION }}-docker.pkg.dev/${{ env.GCP_PROJECT_ID }}/${{ env.ARTIFACT_REPO }}/${{ env.DATAFLOW_IMAGE_NAME }}" >> "$GITHUB_ENV"
          echo "DATAFLOW_RUN_PARAMETERS=subscription=projects/${{ env.GCP_PROJECT_ID }}/subscriptions/btc_pull_topic,output=${{ env.GCP_PROJECT_ID }}:bitcoin_streaming_dataset.bitcoin-data-streaming-table,temp_location=gs://${{ env.DATAFLOW_STAGING_BUCKET }}/tmp" >> "$GITHUB_ENV"

      - name: Checkout
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ env.GCP_BUILD_AND_DEPLOY_KEY }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Build flex template spec in GCS
        run: |
          jq '.metadata' src/btc_streaming_etl/dataflow/flex_template.json > metadata.json
          gcloud dataflow flex-template build "${{ env.FLEX_TEMPLATE_URI }}" \
            --image "${{ env.DATAFLOW_IMAGE_REPO }}:beam-latest" \
            --sdk-language "PYTHON" \
            --metadata-file metadata.json \
            --service-account-email "${{ env.DATAFLOW_SERVICE_ACCOUNT_EMAIL }}" \
            --project "${{ env.GCP_PROJECT_ID }}" \
            --quiet

      - name: Run Dataflow flex template job
        run: |
          gcloud dataflow flex-template run "btc-streaming-${{ github.run_id }}" \
            --template-file-gcs-location "${{ env.FLEX_TEMPLATE_URI }}" \
            --project "${{ env.GCP_PROJECT_ID }}" \
            --region "${{ env.REGION }}" \
            --launcher-machine-type "${{ env.MACHINE_TYPE }}" \
            --service-account-email "${{ env.DATAFLOW_SERVICE_ACCOUNT_EMAIL }}" \
            --staging-location "${{ env.DATAFLOW_STAGING_LOCATION_URI }}" \
            --temp-location "${{ env.DATAFLOW_TEMP_LOCATION_URI }}" \
            --parameters "${{ env.DATAFLOW_RUN_PARAMETERS }}" \
            --quiet
