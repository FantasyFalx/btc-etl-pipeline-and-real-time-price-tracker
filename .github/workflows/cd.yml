name: CD

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  # Secrets → vars
  GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
  GCP_REGION: ${{ secrets.GCP_REGION }}
  GCP_SA_KEY: ${{ secrets.BUILD_AND_DEPLOY_KEY }}
  COMPUTE_SERVICE_ACCOUNT_EMAIL: ${{ secrets.COMPUTE_SERVICE_ACCOUNT_EMAIL }}
  DATAFLOW_SERVICE_ACCOUNT_EMAIL: ${{ secrets.DATAFLOW_SERVICE_ACCOUNT_EMAIL }}
  DATAFLOW_STAGING_BUCKET: ${{ secrets.DATAFLOW_STAGING_BUCKET }}

  # Constants
  ARTIFACT_REPO: pub-sub-script-repo
  PUBSUB_IMAGE_NAME: btc-pubsub-messenger
  DATAFLOW_IMAGE_NAME: btc-dataflow-pipeline

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set image paths
        run: |
          echo "PUBSUB_IMAGE=${{ secrets.GCP_REGION }}-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/${{ env.ARTIFACT_REPO }}/${{ env.PUBSUB_IMAGE_NAME }}" >> "$GITHUB_ENV"
          echo "DATAFLOW_IMAGE=${{ secrets.GCP_REGION }}-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/${{ env.ARTIFACT_REPO }}/${{ env.DATAFLOW_IMAGE_NAME }}" >> "$GITHUB_ENV"

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ env.GCP_SA_KEY }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker ${{ env.GCP_REGION }}-docker.pkg.dev --quiet

      - name: Build and push Pub/Sub messenger image
        uses: docker/build-push-action@v6
        with:
          context: ./src
          file: ./src/btc_streaming_etl/pubsub/Dockerfile
          push: true
          tags: |
            ${{ env.PUBSUB_IMAGE }}:${{ github.sha }}
            ${{ env.PUBSUB_IMAGE }}:latest

      - name: Build and push Dataflow pipeline image
        uses: docker/build-push-action@v6
        with:
          context: ./src
          file: ./src/btc_streaming_etl/dataflow/Dockerfile
          push: true
          tags: |
            ${{ env.DATAFLOW_IMAGE }}:${{ github.sha }}
            ${{ env.DATAFLOW_IMAGE }}:latest

  deploy:
    runs-on: ubuntu-latest
    needs: build-and-push
    permissions:
      contents: read

    steps:
      - name: Set image paths
        run: |
          echo "PUBSUB_IMAGE=${{ secrets.GCP_REGION }}-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/${{ env.ARTIFACT_REPO }}/${{ env.PUBSUB_IMAGE_NAME }}" >> "$GITHUB_ENV"

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ env.GCP_SA_KEY }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Deploy Pub/Sub messenger Cloud Run job
        run: |
          gcloud run jobs deploy btc-pubsub-messenger \
            --image "${{ env.PUBSUB_IMAGE }}:latest" \
            --region "${{ env.GCP_REGION }}" \
            --service-account "${{ env.COMPUTE_SERVICE_ACCOUNT_EMAIL }}" \
            --tasks 1 \
            --max-retries 3 \
            --task-timeout 168h \
            --execute-now \
            --quiet

  deploy-dataflow:
    runs-on: ubuntu-latest
    needs: build-and-push
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set paths
        run: |
          echo "DATAFLOW_IMAGE=${{ secrets.GCP_REGION }}-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/${{ env.ARTIFACT_REPO }}/${{ env.DATAFLOW_IMAGE_NAME }}" >> "$GITHUB_ENV"
          echo "TEMPLATE_GCS_PATH=gs://${{ secrets.DATAFLOW_STAGING_BUCKET }}/templates/btc-dataflow-pipeline.json" >> "$GITHUB_ENV"

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ env.GCP_SA_KEY }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Build flex template spec in GCS
        run: |
          jq '.metadata' src/btc_streaming_etl/dataflow/flex_template.json > metadata.json
          gcloud dataflow flex-template build "${{ env.TEMPLATE_GCS_PATH }}" \
            --image-gcr-path "${{ env.DATAFLOW_IMAGE }}:latest" \
            --sdk-language "PYTHON" \
            --metadata-file metadata.json \
            --project "${{ env.GCP_PROJECT_ID }}" \
            --region "${{ env.GCP_REGION }}" \
            --quiet

      - name: Run Dataflow flex template job
        run: |
          gcloud dataflow flex-template run "btc-streaming-${{ github.run_id }}" \
            --template-file-gcs-location "${{ env.TEMPLATE_GCS_PATH }}" \
            --project "${{ env.GCP_PROJECT_ID }}" \
            --region "${{ env.GCP_REGION }}" \
            --service-account-email "${{ env.DATAFLOW_SERVICE_ACCOUNT_EMAIL }}" \
            --parameters "subscription=projects/${{ env.GCP_PROJECT_ID }}/subscriptions/btc_pull_topic,output=${{ env.GCP_PROJECT_ID }}.bitcoin_streaming_dataset.bitcoin-data-streaming-table,temp_location=gs://${{ env.DATAFLOW_STAGING_BUCKET }}/tmp" \
            --quiet
