name: CD

# TODO: Add a trigger for the CD pipeline to run when a pull request is merged into the main branch.
on:
  push:
    branches:
      - main
    types:
      - closed

  workflow_dispatch:

env:
  # Replace secrets in GitHub repo settings → Secrets and variables → Actions
  GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
  GCP_REGION: ${{ secrets.GCP_REGION }} # e.g. us-central1
  GCP_SA_KEY: ${{ secrets.GCP_ARTIFACT_REGISTRY_KEY }} # JSON key for Artifact Registry push SA

  # Artifact Registry repo (match terraform repository_ids[0])
  PUBSUB_ARTIFACT_REPO: pub-sub-script-repo
  PUBSUB_IMAGE_NAME: btc-pubsub-messenger

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ env.GCP_SA_KEY }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker ${{ env.GCP_REGION }}-docker.pkg.dev --quiet

      - name: Set image tags
        run: |
          REGISTRY="${{ env.GCP_REGION }}-docker.pkg.dev/${{ env.GCP_PROJECT_ID }}"
          echo "PUBSUB_IMAGE=${REGISTRY}/${{ env.PUBSUB_ARTIFACT_REPO }}/${{ env.PUBSUB_IMAGE_NAME }}" >> "$GITHUB_ENV"

      - name: Build and push Pub/Sub messenger image
        uses: docker/build-push-action@v6
        with:
          context: ./src
          file: ./src/btc_streaming_etl/pubsub/Dockerfile
          push: true
          tags: |
            ${{ env.PUBSUB_IMAGE }}:${{ github.sha }}
            ${{ env.PUBSUB_IMAGE }}:latest
      
      
  deploy:
    runs-on: ubuntu-latest
    needs: build-and-push
    if: github.event_name == 'workflow_dispatch'
    permissions:
      contents: read

    steps:
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_ARTIFACT_REGISTRY_KEY }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Set image URI
        run: |
          REGISTRY="${{ env.GCP_REGION }}-docker.pkg.dev/${{ env.GCP_PROJECT_ID }}"
          echo "PUBSUB_IMAGE=${REGISTRY}/${{ env.PUBSUB_ARTIFACT_REPO }}/${{ env.PUBSUB_IMAGE_NAME }}" >> "$GITHUB_ENV"

      - name: Deploy Pub/Sub messenger to Cloud Run
        run: |
          gcloud run deploy btc-pubsub-messenger \
            --image "${PUBSUB_IMAGE}:latest" \
            --region "${{ env.GCP_REGION }}" \
            --service-account "compute-8888@${{ env.GCP_PROJECT_ID }}.iam.gserviceaccount.com" \
            --quiet