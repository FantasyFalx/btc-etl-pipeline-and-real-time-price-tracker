name: CD

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
  GCP_REGION: ${{ secrets.GCP_REGION }}
  GCP_SA_KEY: ${{ secrets.BUILD_AND_DEPLOY_KEY }}
  PUBSUB_ARTIFACT_REPO: pub-sub-script-repo
  PUBSUB_IMAGE_NAME: btc-pubsub-messenger

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4
      
      - name: Set image URI
        run: |
          PROJECT_ID="$(printf '%s' '${{ secrets.GCP_PROJECT_ID }}' | tr -d '[:space:]')"
          REGION="$(printf '%s' '${{ secrets.GCP_REGION }}' | tr -d '[:space:]')"
          REPO="pub-sub-script-repo"
          IMAGE_NAME="btc-pubsub-messenger"

          if [ -z "$PROJECT_ID" ] || [ -z "$REGION" ]; then
            echo "::error::GCP_PROJECT_ID and GCP_REGION must be set in repository secrets."
            exit 1
          fi

          PUBSUB_IMAGE="${REGION}-docker.pkg.dev/${PROJECT_ID}/${REPO}/${IMAGE_NAME}"
          echo "PUBSUB_IMAGE=${PUBSUB_IMAGE}" >> "$GITHUB_ENV"
          echo "Image: ${PUBSUB_IMAGE}"

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ env.GCP_SA_KEY }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker ${{ env.GCP_REGION }}-docker.pkg.dev --quiet

      - name: Build and push Pub/Sub messenger image
        uses: docker/build-push-action@v6
        with:
          context: ./src
          file: ./src/btc_streaming_etl/pubsub/Dockerfile
          push: true
          tags: |
            ${{ env.PUBSUB_IMAGE }}:${{ github.sha }}
            ${{ env.PUBSUB_IMAGE }}:latest

  deploy:
    runs-on: ubuntu-latest
    needs: build-and-push
    if: github.event_name == 'workflow_dispatch'
    permissions:
      contents: read

    steps:
      - name: Set image URI
        run: |
          PROJECT_ID="$(printf '%s' '${{ secrets.GCP_PROJECT_ID }}' | tr -d '[:space:]')"
          REGION="$(printf '%s' '${{ secrets.GCP_REGION }}' | tr -d '[:space:]')"
          PUBSUB_IMAGE="${REGION}-docker.pkg.dev/${PROJECT_ID}/pub-sub-script-repo/btc-pubsub-messenger"
          echo "PUBSUB_IMAGE=${PUBSUB_IMAGE}" >> "$GITHUB_ENV"

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_ARTIFACT_REGISTRY_KEY }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2
      

      ## TODO: Add role to deploy to cloud run for the service account. 
      - name: Deploy Pub/Sub messenger to Cloud Run
        run: |
          gcloud run deploy btc-pubsub-messenger \
            --image "${PUBSUB_IMAGE}:latest" \
            --region "${{ env.GCP_REGION }}" \
            --service-account "compute-8888@${{ env.GCP_PROJECT_ID }}.iam.gserviceaccount.com" \
            --quiet
