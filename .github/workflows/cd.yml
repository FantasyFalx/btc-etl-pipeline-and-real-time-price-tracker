name: CD

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
  GCP_REGION: ${{ secrets.GCP_REGION }}
  GCP_SA_KEY: ${{ secrets.GCP_ARTIFACT_REGISTRY_KEY }}
  ## TODO: Add these to github secrets. 
  PUBSUB_ARTIFACT_REPO: ${{ secrets.PUB_SUB_REPOSITORY_NAME }}
  PUBSUB_IMAGE_NAME: ${{ secrets.PUBSUB_IMAGE_NAME }}
  PUBSUB_IMAGE: ${{ secrets.GCP_REGION }}-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/${{ secrets.PUB_SUB_REPOSITORY_NAME }}/${{ secrets.PUBSUB_IMAGE_NAME }}
  ## 
jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate GCP configuration
        run: |
          if [ -z "${{ secrets.GCP_PROJECT_ID }}" ] || [ -z "${{ secrets.GCP_REGION }}" ]; then
            echo "::error::GCP_PROJECT_ID and GCP_REGION must be set in repository secrets."
            exit 1
          fi

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ env.GCP_SA_KEY }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker ${{ env.GCP_REGION }}-docker.pkg.dev --quiet

      - name: Build and push Pub/Sub messenger image
        uses: docker/build-push-action@v6
        with:
          context: ./src
          file: ./src/btc_streaming_etl/pubsub/Dockerfile
          push: true
          tags: |
            ${{ env.PUBSUB_IMAGE }}:${{ github.sha }}
            ${{ env.PUBSUB_IMAGE }}:latest

  deploy:
    runs-on: ubuntu-latest
    needs: build-and-push
    if: github.event_name == 'workflow_dispatch'
    permissions:
      contents: read

    steps:
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_ARTIFACT_REGISTRY_KEY }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Deploy Pub/Sub messenger to Cloud Run
        run: |
          gcloud run deploy btc-pubsub-messenger \
            --image "${{ env.PUBSUB_IMAGE }}:latest" \
            --region "${{ env.GCP_REGION }}" \
            --service-account "compute-8888@${{ env.GCP_PROJECT_ID }}.iam.gserviceaccount.com" \
            --quiet
