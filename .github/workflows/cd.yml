name: CD

on:
  push:
    branches: [main]
  workflow_dispatch:


env:
  
  # GCP Constants
  ## TODO: Update the secret configs so no formatting and reference errors occur.
  PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
  GAR_LOCATION: ${{ secrets.GCP_REGION }}
  GCP_SA_KEY: ${{ secrets.BUILD_AND_DEPLOY_KEY }}
  COMPUTE_SERVICE_ACCOUNT_EMAIL: ${{ secrets.COMPUTE_SERVICE_ACCOUNT_EMAIL }}
  DATAFLOW_SERVICE_ACCOUNT_EMAIL: ${{ secrets.DATAFLOW_SERVICE_ACCOUNT_EMAIL }}
  DATAFLOW_STAGING_BUCKET: ${{ secrets.DATAFLOW_STAGING_BUCKET }}

  
  
  # Container constants
  ARTIFACT_REPO: pub-sub-script-repo
  PUBSUB_IMAGE_NAME: btc-pubsub-messenger
  DATAFLOW_IMAGE_NAME: btc-dataflow-pipeline
  # us-central1-docker.pkg.dev/bitcoin-streaming-etl-project/pub-sub-script-repo

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ env.GCP_SA_KEY }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker ${{ env.GAR_LOCATION }}-docker.pkg.dev --quiet

      - name: Debug container image URI parts
        run: |
          echo "=== Debugging Pub/Sub Messenger Build and Push ==="
          echo "GAR_LOCATION: ${{ env.GAR_LOCATION }}"
          echo "PROJECT_ID: ${{ env.PROJECT_ID }}"
          echo "ARTIFACT_REPO: ${{ env.ARTIFACT_REPO }}"
          echo "PUBSUB_IMAGE_NAME: ${{ env.PUBSUB_IMAGE_NAME }}"
          echo "Full Pub/Sub Image URI:"
          echo "${{ env.GAR_LOCATION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.ARTIFACT_REPO }}/${{ env.PUBSUB_IMAGE_NAME }}:${{ github.sha }}"
          echo

          echo "=== Debugging Dataflow Build and Push ==="
          echo "GAR_LOCATION: ${{ env.GAR_LOCATION }}"
          echo "PROJECT_ID: ${{ env.PROJECT_ID }}"
          echo "ARTIFACT_REPO: ${{ env.ARTIFACT_REPO }}"
          echo "DATAFLOW_IMAGE_NAME: ${{ env.DATAFLOW_IMAGE_NAME }}"
          echo "Full Dataflow Image URI:"
          echo "${{ env.GAR_LOCATION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.ARTIFACT_REPO }}/${{ env.DATAFLOW_IMAGE_NAME }}:${{ github.sha }}"
 

      # Pub/Sub messenger build and push.
      # [registry]/[namespace]/[image]:[tag]
      - name: Build and push Pub/Sub messenger image
        uses: docker/build-push-action@v6
        with:
          context: ./src
          file: ./src/btc_streaming_etl/pubsub/Dockerfile
          push: true
          tags: |
            ${{ env.GAR_LOCATION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.ARTIFACT_REPO }}/${{ env.PUBSUB_IMAGE_NAME }}:${{ github.sha }}
            ${{ env.GAR_LOCATION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.ARTIFACT_REPO }}/${{ env.PUBSUB_IMAGE_NAME }}:pubsub-latest

      
      # Dataflow build and push.
      # [registry]/[namespace]/[image]:[tag]
      - name: Build and push Dataflow pipeline image
        uses: docker/build-push-action@v6
        with:
          context: ./src
          file: ./src/btc_streaming_etl/dataflow/Dockerfile
          push: true
          tags: |            
            ${{ env.GAR_LOCATION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.ARTIFACT_REPO }}/${{ env.DATAFLOW_IMAGE_NAME }}:${{ github.sha }}
            ${{ env.GAR_LOCATION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.ARTIFACT_REPO }}/${{ env.DATAFLOW_IMAGE_NAME }}:beam-latest
    
  # Pub/Sub messenger Cloud Run job deployment.
  deploy-pubsub:
    runs-on: ubuntu-latest
    needs: build-and-push
    permissions:
      contents: read

    steps:
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ env.GCP_SA_KEY }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Deploy Pub/Sub messenger Cloud Run job.
        run: |
          gcloud run jobs deploy btc-pubsub-messenger \
            --image "${{ env.GAR_LOCATION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.ARTIFACT_REPO }}/${{ env.PUBSUB_IMAGE_NAME }}:latest" \
            --region "${{ env.GAR_LOCATION }}" \
            --service-account "${{ env.COMPUTE_SERVICE_ACCOUNT_EMAIL }}" \
            --tasks 1 \
            --max-retries 3 \
            --task-timeout 168h \
            --execute-now \
            --quiet
  
  # Dataflow flex template deployment.
  deploy-dataflow:
    runs-on: ubuntu-latest
    needs: build-and-push
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ env.GCP_SA_KEY }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2
      
      # Build flex template spec in GCS.
      - name: Build flex template spec in GCS
        run: |
          jq '.metadata' src/btc_streaming_etl/dataflow/flex_template.json > metadata.json
          gcloud dataflow flex-template build "gs://${{ env.DATAFLOW_STAGING_BUCKET }}/templates/btc-dataflow-pipeline.json" \
            --image-gcr-path "${{ env.GAR_LOCATION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.ARTIFACT_REPO }}/${{ env.DATAFLOW_IMAGE_NAME }}:latest" \
            --sdk-language "PYTHON" \
            --metadata-file metadata.json \
            --project "${{ env.PROJECT_ID }}" \
            --region "${{ env.GAR_LOCATION }}" \
            --quiet
      
      # Run Dataflow flex template job.
      - name: Run Dataflow flex template job
        run: |
          gcloud dataflow flex-template run "btc-streaming-${{ github.run_id }}" \
            --template-file-gcs-location "gs://${{ env.DATAFLOW_STAGING_BUCKET }}/templates/btc-dataflow-pipeline.json" \
            --project "${{ env.PROJECT_ID }}" \
            --region "${{ env.GAR_LOCATION }}" \
            --service-account-email "${{ env.DATAFLOW_SERVICE_ACCOUNT_EMAIL }}" \
            --parameters "subscription=projects/${{ env.PROJECT_ID }}/subscriptions/btc_pull_topic,output=${{ env.PROJECT_ID }}.bitcoin_streaming_dataset.bitcoin-data-streaming-table,temp_location=gs://${{ env.DATAFLOW_STAGING_BUCKET }}/tmp" \
            --quiet
