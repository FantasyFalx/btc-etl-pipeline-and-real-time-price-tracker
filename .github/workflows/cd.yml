name: CD

on:
  push:
    branches: [main]
  workflow_dispatch:


env:
  
  # GCP constants.
  GCP_PROJECT_ID: "bitcoin-streaming-etl-project"
  GAR_LOCATION: "us-central1"
  DATAFLOW_ZONE: "us-east1-b"
  DATAFLOW_STAGING_BUCKET: "staging-bucket-88888"
  MACHINE_TYPE: "e2-medium"
  REGION: "us-east1"

  # GCP secrets and service account emails.
  GCP_BUILD_AND_DEPLOY_KEY: ${{ secrets.BUILD_AND_DEPLOY_KEY }}
  COMPUTE_SERVICE_ACCOUNT_EMAIL: ${{ secrets.COMPUTE_SERVICE_ACCOUNT_EMAIL }}
  DATAFLOW_SERVICE_ACCOUNT_EMAIL: ${{ secrets.DATAFLOW_SERVICE_ACCOUNT_EMAIL }}

  # Container constants and image names.
  ARTIFACT_REPO: pub-sub-script-repo
  PUBSUB_IMAGE_NAME: btc-pubsub-messenger
  DATAFLOW_IMAGE_NAME: btc-dataflow-pipeline

  # Image URIs. 
  # ** Uri structure: [registry]/[namespace]/[image]:[tag] **
  PUBSUB_IMAGE_URI: >-
    ${{ env.GAR_LOCATION }}-docker.pkg.dev/${{ env.GCP_PROJECT_ID }}/${
    { env.ARTIFACT_REPO }}/${{ env.PUBSUB_IMAGE_NAME }}:${{ github.sha }}
  
  DATAFLOW_IMAGE_URI: >-
    ${{ env.GAR_LOCATION }}-docker.pkg.dev/${{ env.GCP_PROJECT_ID }}/${
    { env.ARTIFACT_REPO }}/${{ env.DATAFLOW_IMAGE_NAME }}:${{ github.sha }}

  FLEX_TEMPLATE_URI: >-
    gs://${{ env.DATAFLOW_STAGING_BUCKET }}/templates/btc-dataflow-pipeline.json

# Bucket URIs. 
# ** Uri structure: gs://[bucket_name] **
DATAFLOW_STAGING_BUCKET_URI: >-
  gs://${{ env.DATAFLOW_STAGING_BUCKET }}

DATAFLOW_TEMP_LOCATION_URI: >-
  ${{{ env.DATAFLOW_STAGING_BUCKET_URI }}/tmp

DATAFLOW_STAGING_LOCATION_URI: >-
  ${{{ env.DATAFLOW_STAGING_BUCKET_URI }}/staging

DATAFLOW_RUN_PARAMETERS: |
  subscription=projects/${{ env.GCP_PROJECT_ID }}/subscriptions/btc_pull_topic,
  output=${{ env.GCP_PROJECT_ID }}:bitcoin_streaming_dataset.bitcoin-data-streaming-table,
  temp_location=gs://${{ env.DATAFLOW_STAGING_BUCKET }}/tmp


# Start of jobs.
jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read

# Container build and push steps.
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ env.GCP_BUILD_AND_DEPLOY_KEY }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker ${{ env.GAR_LOCATION }}-docker.pkg.dev --quiet

      - name: Debug container image URI parts
        run: |
          
    
      - name: Build and push pubsub publisher component image.
        uses: docker/build-push-action@v6
        with:
          context: ./src
          file: ./src/btc_streaming_etl/pubsub/Dockerfile
          push: true
          tags: |
            ${{ env.PUBSUB_IMAGE_URI }}
            ${{ env.PUBSUB_IMAGE_URI }}:pubsub-latest

      
      - name: Build and push dataflow pipeline image.
        uses: docker/build-push-action@v6
        with:
          context: ./src
          file: ./src/btc_streaming_etl/dataflow/Dockerfile
          push: true
          tags: |            
            ${{ env.DATAFLOW_IMAGE_URI }}
            ${{ env.DATAFLOW_IMAGE_URI }}:beam-latest
    
# Cloud Run job deployment steps.
  deploy-pubsub:
    runs-on: ubuntu-latest
    needs: build-and-push
    permissions:
      contents: read

    steps:
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ env.GCP_BUILD_AND_DEPLOY_KEY }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Deploy Pub/Sub messenger Cloud Run job.
        run: |
          gcloud run jobs deploy btc-pubsub-messenger \
            --image "${{ env.PUBSUB_IMAGE_URI }}:pubsub-latest" \
            --region "${{ env.GAR_LOCATION }}" \
            --service-account "${{ env.COMPUTE_SERVICE_ACCOUNT_EMAIL }}" \
            --tasks 1 \
            --max-retries 3 \
            --task-timeout 168h \
            --execute-now \
            --quiet
  
# Dataflow flex template deployment steps.
  deploy-dataflow:
    runs-on: ubuntu-latest
    needs: build-and-push
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ env.GCP_BUILD_AND_DEPLOY_KEY }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2
      
      - name: Build flex template spec in GCS
        run: |
          jq '.metadata' src/btc_streaming_etl/dataflow/flex_template.json > metadata.json
          gcloud dataflow flex-template build "${{ env.FLEX_TEMPLATE_URI }}" \
            --image "${{ env.DATAFLOW_IMAGE_URI }}:beam-latest" \
            --sdk-language "PYTHON" \
            --metadata-file metadata.json \
            --service-account-email "${{ env.DATAFLOW_SERVICE_ACCOUNT_EMAIL }}" \
            --project "${{ env.GCP_PROJECT_ID }}" \
            --quiet
      
      - name: Run Dataflow flex template job
        run: |
          gcloud dataflow flex-template run "btc-streaming-${{ github.run_id }}" \
            --template-file-gcs-location "${{ env.FLEX_TEMPLATE_URI }}" \
            --project "${{ env.GCP_PROJECT_ID }}" \
            --region "${{ env.REGION }}" \
            --launcher-machine-type "${{ env.MACHINE_TYPE }}" \
            --service-account-email "${{ env.DATAFLOW_SERVICE_ACCOUNT_EMAIL }}" \
            --staging-location "${{ env.DATAFLOW_STAGING_LOCATION_URI }}" \
            --temp-location "${{ env.DATAFLOW_TEMP_LOCATION_URI }}" \
            --parameters "${{ env.DATAFLOW_RUN_PARAMETERS }}" \
            --quiet
       